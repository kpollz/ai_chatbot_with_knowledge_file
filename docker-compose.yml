services:
  postgres:
    image: postgres:16-alpine
    container_name: machine-issue-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-issue_api}
      # Read by the init script below, which creates the agent's own database.
      AGENT_DB_NAME: ${AGENT_DB_NAME:-agent_state}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./issue-api/postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  issue-api:
    build: ./issue-api
    container_name: machine-issue-api
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-issue_api}
      API_HOST: 0.0.0.0
      API_PORT: 8888
    ports:
      - "8888:8888"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./issue-api/app:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8888 --reload

  # Two services, one image built from ./agent — they share the graph, so they
  # share a source tree. Each picks its own entrypoint below.
  #
  # First: the agent over AG-UI, drivable by any AG-UI client (CopilotKit).
  # Conversation threads live in their own Postgres database — the agent itself
  # holds no user identity and no API keys; the platform in front owns those.
  agent:
    build: ./agent
    container_name: machine-issue-agent
    environment:
      ISSUE_API_URL: http://issue-api:8888
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      # Its own database: the checkpointer owns the schema there, so it must not
      # share one with the Issue API.
      DATABASE_URI: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${AGENT_DB_NAME:-agent_state}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
    ports:
      - "8123:8123"
    depends_on:
      postgres:
        condition: service_healthy
      issue-api:
        condition: service_started
    volumes:
      - ./agent/app:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8123

  # Second: the Streamlit UI, until the CopilotKit front end replaces it.
  chatbot:
    build: ./agent
    container_name: machine-issue-chatbot
    environment:
      ISSUE_API_URL: http://issue-api:8888
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
      # OpenAI-compatible endpoint (native tool calling)
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      CONTEXT_WINDOW_LIMIT: ${CONTEXT_WINDOW_LIMIT:-128000}
      CONTEXT_WARN_THRESHOLD: ${CONTEXT_WARN_THRESHOLD:-100000}
    ports:
      - "8501:8501"
    depends_on:
      - issue-api
    volumes:
      - ./agent/app:/app
    command: streamlit run streamlit_app.py --server.port=8501 --server.address=0.0.0.0
