# Every service reads .env — see .env.example for the full list.
services:
  postgres:
    image: postgres:16-alpine
    container_name: machine-issue-postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-issue_api}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./issue-api/postgres_data:/var/lib/postgresql/data
      # Creates the agent's database on first init of the volume.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  issue-api:
    build: ./issue-api
    container_name: machine-issue-api
    env_file: .env
    ports:
      - "8888:8888"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./issue-api/app:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8888 --reload

  # The agent over AG-UI, drivable by any AG-UI client (CopilotKit).
  agent:
    build: ./agent
    container_name: machine-issue-agent
    env_file: .env
    ports:
      - "8123:8123"
    depends_on:
      postgres:
        condition: service_healthy
      issue-api:
        condition: service_started
    volumes:
      - ./agent/main.py:/app/main.py:ro
      - ./agent/src:/app/src:ro
    command: uvicorn main:app --host 0.0.0.0 --port 8123
